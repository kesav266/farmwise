services:
  - type: web
    name: farmwise-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m scripts.init_db && uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: DATABASE_URL
        fromDatabase:
          name: farmwise-ai-db
          property: connectionString

databases:
  - name: farmwise-ai-db
    databaseName: farmwise
    user: farmwise
